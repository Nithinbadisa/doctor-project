<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" aria-label="Antara home" (click)="closeMenu()">
      <img class="brand__mark" src="/antara-mark.png" alt="">
      <span class="brand__word">Antara<span>.</span></span>
    </a>
    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="site-navigation" (click)="toggleMenu()">
      <span>{{ menuOpen() ? 'Close' : 'Menu' }}</span>
      <span aria-hidden="true">{{ menuOpen() ? '×' : '+' }}</span>
    </button>
    <nav id="site-navigation" class="primary-nav" [class.primary-nav--open]="menuOpen()" aria-label="Main navigation">
      <a routerLink="/services" routerLinkActive="is-active" (click)="closeMenu()">Support options</a>
      <a routerLink="/therapies" routerLinkActive="is-active" (click)="closeMenu()">Therapies</a>
      <a routerLink="/assessments" routerLinkActive="is-active" (click)="closeMenu()">Self-checks</a>
      <a routerLink="/resources" routerLinkActive="is-active" (click)="closeMenu()">Guides</a>
      <a class="nav-cta" routerLink="/services" (click)="closeMenu()">Find support <span aria-hidden="true">→</span></a>
    </nav>
  </div>
</header>
