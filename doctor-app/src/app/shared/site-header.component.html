<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" aria-label="MindCare home" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">m</span>
      <span class="brand__word">mindcare<span>.</span></span>
    </a>
    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="site-navigation" (click)="toggleMenu()">
      <span>{{ menuOpen() ? 'Close' : 'Menu' }}</span>
      <span aria-hidden="true">{{ menuOpen() ? '×' : '+' }}</span>
    </button>
    <nav id="site-navigation" class="primary-nav" [class.primary-nav--open]="menuOpen()" aria-label="Main navigation">
      <a routerLink="/services" routerLinkActive="is-active" (click)="closeMenu()">Services</a>
      <a routerLink="/therapies" routerLinkActive="is-active" (click)="closeMenu()">Therapies</a>
      <a routerLink="/assessments" routerLinkActive="is-active" (click)="closeMenu()">Self-checks</a>
      <a routerLink="/resources" routerLinkActive="is-active" (click)="closeMenu()">Resources</a>
      <a routerLink="/how-it-works" routerLinkActive="is-active" (click)="closeMenu()">How it works</a>
      <a class="nav-cta" routerLink="/how-it-works" (click)="closeMenu()">Explore care <span aria-hidden="true">→</span></a>
    </nav>
  </div>
</header>
